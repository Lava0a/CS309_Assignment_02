<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio - Contact</title>
    <link rel="stylesheet" href="css/Stylesheet.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="index.html">Studio</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="components.html">Components</a></li>
                <li><a class="active" href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <form class="form-container">
            <h1>Contact Me</h1>

            <div class="form-group">
                <label for="name">Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="1">
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date">
            </div>

            <fieldset>
                <legend>Gender</legend>
                <div class="choice-group">
                    <label class="choice-label"><input type="radio" name="gender" value="male"> Male</label>
                    <label class="choice-label"><input type="radio" name="gender" value="female"> Female</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Interests</legend>
                <div class="choice-group">
                    <label class="choice-label"><input type="checkbox" name="interests" value="html"> HTML</label>
                    <label class="choice-label"><input type="checkbox" name="interests" value="css"> CSS</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course">
                    <option>CS309</option>
                    <option>CS305</option>
                    <option>CS302</option>
                    <option>CS304</option>
                    <option>CS307</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>
            </div>

            <input class="submit-btn" type="submit" value="Send">
        </form>
    </main>
    <footer class="site-footer">
        <div class="container">&copy; 2026 Studio</div>
    </footer>
</body>
</html>
